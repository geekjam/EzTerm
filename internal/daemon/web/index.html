<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ezterm Web Terminal</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.css">
  <link rel="stylesheet" href="/web/style.css">
  <script defer src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.js"></script>
  <script defer src="/web/app.js"></script>
</head>
<body>
  <div id="status" class="status">connecting...</div>
  <button id="files-open" class="files-open" type="button" hidden>Files</button>
  <div id="terminal"></div>
  <div id="modal" class="modal" hidden>
    <div class="modal-box" role="alertdialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-message">
      <h1 id="modal-title" class="modal-title"></h1>
      <p id="modal-message" class="modal-message"></p>
      <form id="password-form" class="password-form" hidden>
        <label class="password-label" for="password-input">Password</label>
        <input id="password-input" class="password-input" type="password" autocomplete="off"
               autocapitalize="off" spellcheck="false" aria-describedby="password-error">
        <p id="password-error" class="password-error" role="alert" hidden></p>
        <p class="password-note">Sent straight to the session. It is never stored or logged.</p>
      </form>
      <div class="modal-actions">
        <button id="modal-cancel" class="modal-button modal-button-quiet" type="button" hidden>Cancel</button>
        <button id="modal-confirm" class="modal-button" type="button">OK</button>
        <button id="modal-send" class="modal-button" type="submit" form="password-form" hidden>Send</button>
      </div>
    </div>
  </div>
  <div id="files-modal" class="modal" hidden>
    <div class="modal-box files-box" role="dialog" aria-modal="true" aria-labelledby="files-title">
      <h1 id="files-title" class="modal-title">Files</h1>
      <div class="files-pathbar">
        <button id="files-home" class="files-chip" type="button">Home</button>
        <button id="files-up" class="files-chip" type="button">Up</button>
        <span id="files-path" class="files-path"></span>
      </div>
      <div class="files-actions">
        <button id="files-upload" class="modal-button" type="button">Upload</button>
        <button id="files-newdir" class="modal-button modal-button-quiet" type="button">New folder</button>
        <input id="files-input" type="file" multiple hidden>
      </div>
      <div id="files-newdir-form" class="files-newdir" hidden>
        <input id="files-newdir-name" class="password-input" type="text" placeholder="folder name"
               autocomplete="off" spellcheck="false">
        <button id="files-newdir-create" class="modal-button" type="button">Create</button>
        <button id="files-newdir-cancel" class="modal-button modal-button-quiet" type="button">Cancel</button>
      </div>
      <div id="files-list" class="files-list" role="list"></div>
      <div id="files-progress" class="files-progress" hidden>
        <div class="files-progress-bar"><span id="files-progress-fill"></span></div>
        <div class="files-progress-row">
          <span id="files-progress-text"></span>
          <button id="files-progress-cancel" class="modal-button modal-button-quiet" type="button">Cancel</button>
        </div>
      </div>
      <p id="files-error" class="files-error" role="alert" hidden></p>
      <div class="modal-actions">
        <button id="files-close" class="modal-button modal-button-quiet" type="button">Close</button>
      </div>
    </div>
  </div>
</body>
</html>
